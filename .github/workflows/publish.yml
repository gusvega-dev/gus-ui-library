name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Ensure Rollup native package
        run: npm install --no-save --package-lock=false @rollup/rollup-linux-x64-gnu

      - name: Build
        run: npm run build

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish GitHub Packages mirror
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_NAME="@gusvega-dev/gus-ui-library"
          TMP_DIR="$(mktemp -d)"

          cp -R dist README.md LICENSE package.json "$TMP_DIR"/
          cd "$TMP_DIR"

          npm pkg set "name=$PACKAGE_NAME"
          npm pkg set "publishConfig.registry=https://npm.pkg.github.com"
          npm pkg delete publishConfig.provenance
          printf "@gusvega-dev:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n" > .npmrc

          if npm view "$PACKAGE_NAME@$VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already published to GitHub Packages."
          else
            npm publish --registry=https://npm.pkg.github.com
          fi
